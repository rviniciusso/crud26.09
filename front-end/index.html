<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorio de equipamentos</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section class="container">
        <h2>Cadastre um Item</h2>
        <form class="cadastrar" id="cadastrar">
            <label for="nome">Nome:</label>
            <input type="text" id="nome">

            <label for="categoria">Categoria:</label>
            <input type="text" id="categoria">

            <label for="marca">Marca:</label>
            <input type="text" id="marca">

            <label for="problema">Problema:</label>
            <input type="text" id="problema">

            <label for="status">Status:</label>
            <select name="status" id="status">
                <option value="Em análise">Em análise</option>
                <option value="Em manutenção">Em manutenção</option>
                <option value="Finalizado">Finalizado</option>
            </select>
            <button type="submit" id="btn-cad">Cadastrar</button>
        </form>
    </section>
    <section class="container">
        <form class="carregar">
            <button id="btn-load">Carregar Itens</button>
            <input type="text" id="filter">
            
                <div>
                    <div class="container-btn">
                        <button>Atualizar</button>
                        <button>Excluir</button>
                    </div>
                </div>
        </form>
        <div class="itens" id="container-itens" class="container-itens">
            <div class="item">
                <p>Carregue os chamados</p>
            </div>
        </div>
        <div>

        </div>
    </section>
    <script src="./index.js"></script>
</body>
</html>
